services:
  postgres:
    image: postgres:16
    container_name: memoria-postgres
    environment:
      POSTGRES_DB: memoria
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: memoria
    ports:
      - "5432:5432"
    volumes:
      - memoria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  memoria_postgres_data:
