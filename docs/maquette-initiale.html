document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

             <\u002Fsc-for>\n                  <span style=\"font-size:12px;color:#8A857C;margin-left:12px;font-family:'IBM Plex Mono',monospace\">+27<\u002Fspan>\n                <\u002Fdiv>\n                <button style=\"width:100%;border:1px dashed #C9C3B8;background:none;cursor:pointer;border-radius:10px;padding:10px;font-size:12.5px;color:#6B6862;font-weight:600\">+ Inviter un camarade<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"border:1px solid #E4E2F6;background:#F6F5FE;border-radius:14px;padding:16px;margin-top:14px\">\n                <div style=\"font-size:13.5px;font-weight:600;color:#4B46D6\">Réviser en groupe<\u002Fdiv>\n                <p style=\"margin:6px 0 12px;font-size:12.5px;color:#6B6862;line-height:1.5\">Lancez un QCM généré à partir des sessions collectives de la classe.<\u002Fp>\n                <button onclick=\"{{ nav.quiz.on }}\" style=\"width:100%;border:none;background:#4B46D6;color:#fff;cursor:pointer;border-radius:9px;padding:10px;font-size:13px;font-weight:600\">Démarrer un QCM<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMastery }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto\">\n        <div style=\"max-width:900px;margin:0 auto;padding:38px 48px 80px\">\n          <h1 style=\"margin:0;font-size:28px;font-weight:700;letter-spacing:-.025em\">Score de maîtrise<\u002Fh1>\n          <p style=\"margin:7px 0 0;font-size:14.5px;color:#6B6862;line-height:1.5\">Votre progression par notion, calculée à partir des cours suivis et des QCM. Matière : <b>{{ mastery.subject }}<\u002Fb>.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:230px 1fr;gap:26px;margin-top:26px;align-items:start\">\n            <div style=\"background:#fff;border:1px solid #E9E5DE;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:ce -radius:9px;padding:8px 14px;font-size:12.5px;font-weight:600\">Réviser les points fragiles<\u002Fbutton><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ mastery.notions }}\" as=\"n\" hint-placeholder-count=\"6\">\n                  <div style=\"border:1px solid #E9E5DE;background:#fff;border-radius:13px;padding:14px 16px\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px\"><span style=\"font-size:14px;font-weight:600\">{{ n.name }}<\u002Fspan><span style=\"font-size:11px;font-weight:600;color:{{ n.color }};background:{{ n.bg }};padding:3px 9px;border-radius:20px\">{{ n.badge }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:11px\"><div style=\"flex:1;height:8px;border-radius:5px;background:#EEEAE2;overflow:hidden\"><div style=\"height:100%;width:{{ n.pct }};background:{{ n.color }};border-radius:5px;transition:width .4s\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:{{ n.color }};width:42px;text-align:right\">{{ n.pct }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTutor }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;overflow:hidden;background:#FBFAF8\">\n        <div style=\"flex:none;display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid #EAE5DC;background:#fff\">\n          <span style=\"width:34px;height:34px;border-radius:10px;background:#EEEDFB;display:flex;align-items:center;justify-content:center\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M8 1.5 L9.4 5.6 L13.5 7 L9.4 8.4 L8 12.5 L6.6 8.4 L2.5 7 L6.6 5.6 Z\" fill=\"#4B46D6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div style=\"flex:1\"><div style=\"font-size:15px;font-weight:700\">Tuteur vocal<\u002Fdiv><div style=\"font-size:11.5px;color:#9A968E\">Révision : {{ tutor.topic }}<\u002Fdiv><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:#6B6862;background:#F4F2EE;border-radius:20px;padding:6px 12px;font-weight:500\">Mode conversation<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;overflow-y:auto;padding:26px 32px\">\n          <div style=\"max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"text-align:center;font-size:12px;color:#B4AFA5;margin-bottom:6px\">L’IA réexplique le cours comme un camarade — réponds à voix haute.<\u002Fdiv>\n            <sc-for list=\"{{ tutor.messages }}\" as=\"m\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;justify-content:{{ m.align }}\">\n                <div style=\"max-width:78%;background:{{ m.bg }};color:{{ m.color }};border:1px solid {{ m.border }};border-radius:15px;padding:12px 15px;font-size:14px;line-height:1.5;box-shadow:0 1px 2px rgba(20,18,15,.03)\">{{ m.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:none;border-top:1px solid #EAE5DC;background:#fff;padding:20px 28px;display:flex;flex-direction:column;align-items:center;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:16px\">\n            <div style=\"display:flex;align-items:flex-end;gap:3px;height:26px;width:60px;justify-content:center\">\n              <span style=\"width:3px;height:40%;background:#C6C0F0;border-radius:2px;transform-origin:bottom;animation:mem-wave 1s ease-in-out infinite\"><\u002Fspan>\n              <span style=\"width:3px;height:80%;background:#B0A9EC;border-radius:2px;transform-origin:bottom;animation:mem-wave 1s ease-in-out .2s infinite\"><\u002Fsp  ease-in-out .25s infinite\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8A857C;font-weight:500\">{{ tutor.micLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAdapted }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto\">\n        <div style=\"max-width:820px;margin:0 auto;padding:32px 48px 90px\">\n          <button onclick=\"{{ goSessions }}\" style=\"border:none;background:none;cursor:pointer;color:#8A857C;font-size:13px;font-weight:500;padding:0;margin-bottom:16px;display:flex;align-items:center;gap:6px\" style-hover=\"color:#4B46D6\">← Sessions<\u002Fbutton>\n          <div style=\"font-size:11px;font-weight:600;color:#8A857C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px\">Résumé adapté<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.2\">{{ adapted.title }}<\u002Fh1>\n\n          <div style=\"display:flex;gap:8px;margin:22px 0 24px;flex-wrap:wrap\">\n            <sc-for list=\"{{ adapted.tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ t.on }}\" style=\"cursor:pointer;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.color }};border-radius:20px;padding:8px 15px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:all .14s\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ adapted.isContenu }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <div style=\"background:linear-gradient(180deg,#F6F5FE,#FBFAFE);border:1px solid #E4E2F6;border-radius:16px;padding:22px 24px;margin-bottom:24px\">\n                <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\"><span style=\"width:24px;height:24px;border-radius:7px;background:#EEEDFB;display:flex;align-items:center;justify-content:center\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M8 1.5 L9.4 5.6 L13.5 7 L9.4 8.4 L8 12.5 L6.6 8.4 L2.5 7 L6.6 5.6 Z\" fill=\"#4B46D6\"><\u002Fpath><\u002Fsvg><\u002Fspan><h2 style=\"margin:0;font-size:15px;font-weight:700\">Synthèse<\u002Fh2><\u002Fdiv>\n                <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:#33302B\">{{ adapted.summary }}<\u002Fp>\n              <\u002Fdiv>\n              <h2 style=\"margin:0 0 13px;font-size:15px;font-weight:700\">Notions clés<\u002Fh2>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ adapted.notions }}\" as=\"d\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #E9E5DE;border-radius:12px;padding:13px 15px\"><span style=\"flex:none;width:22px;height:22px;border-radius:6px;background:#EEEDFB;color:#4B46D6;font-size:11.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center\">{{ d.n }}<\u002Fspan><span style=\"font-size:14px;line-height:1.5;color:#33302B;padding-top:1px\">{{ d.t }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ adapted.isExercices }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <sc-for list=\"{{ adapted.exercices }}\" as=\"ex\" hint-placeholder-count=\"2\">\n                <div style=\"border:1px solid #E9E5DE;background:#fff;border-radius:14px;padding:18px 20px\">\n                  <div style=\"display:flex;gap:10px;align-items:flex-start;margin-bottom:12px\"><span style=\"flex:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#4B46D6;background:#EEEDFB;padding:3px 9px;border-radius:6px\">Énoncé<\u002Fspan><span style=\"font-size:14.5px;font-weight:600;line-height:1.5\">{{ ex.q }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"border-top:1px solid #F1EDE6;padding-top:12px;display:flex;gap:10px;align-items:flex-start\"><span style=\"flex:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#2E9E6B;background:#E9F6EF;padding:3px 9px;border-radius:6px\">Corrigé<\u002Fspan><span style=\"font-size:14px;line-height:1.6;color:#33302B\">{{ ex.correction }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ adapted.isAnnonces }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ adapted.annonces }}\" as=\"an\" hint-placeholder-count=\"2\">\n                <div style=\"border:1px solid #F0E4C8;background:#FDFAF1;border-radius:13px;padding:15px 17px;display:flex;gap:12px;align-items:flex-start\">\n                  <span style=\"flex:none;width:28px;height:28px;border-radius:8px;background:#FBF3E1;display:flex;align-items:center;justify-content:center\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M3 6 L9 3 V13 L3 10 Z\" fill=\"#C99A2E\"><\u002Fpath><path d=\"M9 4.5 C11 5 12 6.2 12 8 C12 9.8 11 11 9 11.5\" stroke=\"#C99A2E\" stroke-width=\"1.3\" fill=\"none\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                  <div><div style=\"font-size:14px;line-height:1.5;color:#33302B\">{{ an.text }}<\u002Fdiv><div style=\"font-size:11.5px;color:#B4832B;margin-top:5px;font-family:'IBM Plex Mono',monospace\">{{ an.date }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ adapted.isQcm }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid #E4E2F6;background:linear-gradient(180deg,#F6F5FE,#FBFAFE);border-radius:16px;padding:34px;text-align:center\">\n              <span style=\"width:48px;height:48px;border-radius:13px;background:#EEEDFB;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 18 18\" fill=\"none\"><circle cx=\"9\" cy=\"9\" r=\"6.5\" stroke=\"#4B46D6\" stroke-width=\"1.6\"><\u002Fcircle><path d=\"M7 7 A2 2 0 1 1 9.2 9.3 V10.4\" stroke=\"#4B46D6\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"9\" cy=\"12.8\" r=\"1\" fill=\"#4B46D6\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n              <div style=\"font-size:18px;font-weight:700;letter-spacing:-.01em\">Teste-toi sur ce cours<\u002Fdiv>\n              <p style=\"margin:8px auto 20px;max-width:380px;font-size:14px;color:#6B6862;line-height:1.55\">Un QCM généré automatiquement à partir des notions de la séance. 3 questions pour vérifier ta compréhension.<\u002Fp>\n              <button onclick=\"{{ adapted.launchQuiz }}\" style=\"border:none;background:#4B46D6;color:#fff;cursor:pointer;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;box-shadow:0 2px 10px rgba(75,70,214,.3)\" style-hover=\"background:#3D39C2\">Lancer le QCM →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto\">\n        <div style=\"max-width:660px;margin:0 auto;padding:40px 48px 90px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px\">\n            <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#4B46D6\">Mode révision · QCM<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#8A857C\">Question {{ quiz.num }} / {{ quiz.total }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:6px;border-radius:4px;background:#EEEAE2;overflow:hidden;margin-bottom:28px\"><div style=\"height:100%;width:{{ quiz.progress }};background:#4B46D6;border-radius:4px;transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n\n          <h1 style=\"margin:0 0 22px;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.3\">{{ quiz.question }}<\u002Fh1>\n\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ quiz.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ o.on }}\" style=\"text-align:left;width:100%;border:1.5px solid {{ o.border }};background:{{ o.bg }};color:{{ o.color }};cursor:pointer;border-radius:12px;padding:15px 17px;font-size:14.5px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:all .14s\" style-hover=\"border-color:#4B46D6\">\n                <span>{{ o.text }}<\u002Fspan>\n                <span style=\"display:{{ o.showIc }};align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:{{ o.color }};color:#fff;font-size:12px;font-weight:700;flex:none\">{{ o.ic }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ quiz.answered }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:22px;animation:mem-in .35s ease both\">\n              <div style=\"border:1px solid #E4E2F6;background:#F6F5FE;border-radius:13px;padding:16px 18px;display:flex;gap:11px;align-items:flex-start\">\n                <span style=\"flex:none;width:24px;height:24px;border-radius:7px;background:#4B46D6;display:flex;align-items:center;justify-content:center\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M8 1.5 L9.4 5.6 L13.5 7 L9.4 8.4 L8 12.5 L6.6 8.4 L2.5 7 L6.6 5.6 Z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <div><div style=\"font-size:12.5px;font-weight:700;color:#4B46D6;margin-bottom:4px\">Explication<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.6;color:#33302B\">{{ quiz.explain }}<\u002Fp><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:flex-end;margin-top:18px\"><button onclick=\"{{ quiz.next }}\" style=\"border:none;background:#1C1B1A;color:#fff;cursor:pointer;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:600\" style-hover=\"background:#000\">Question suivante →<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isEngagements }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:38px 48px 60px\">\n          <h1 style=\"margin:0;font-size:28px;font-weight:700;letter-spacing:-.025em\">Suivi des engagements<\u002Fh1>\n          <p style=\"margin:7px 0 0;font-size:14.5px;color:#6B6862;max-width:600px;line-height:1.5\">Chaque tâche extraite d’une réunion suit un cycle de vie — de la proposition détectée par l’IA jusqu’à sa clôture. Cliquez sur un engagement proposé pour le confirmer.<\u002Fp>\n\n          <div style=\"display:flex;gap:14px;overflow-x:auto;padding:26px 2px 14px;align-items:flex-start\">\n            <sc-for list=\"{{ eng.columns }}\" as=\"col\" hint-placeholder-count=\"5\">\n              <div style=\"flex:none;width:256px\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 2px\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ col.color }}\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#4A463F\">{{ col.label }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#B4AFA5\">{{ col.count }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:10px\">\n                  <sc-for list=\"{{ col.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                    <button onclick=\"{{ it.open }}\" style=\"text-align:left;width:100%;border:1px solid #E9E5DE;background:#fff;cursor:pointer;border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(20,18,15,.03);transition:all .14s\" style-hover=\"border-color:#D6D0C6;box-shadow:0 4px 14px rgba(20,18,15,.07)\">\n                      <div style=\"font-size:13.5px;font-weight:600;line-height:1.4;color:#1C1B1A\">{{ it.title }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                        <span style=\"display:flex;align-items:center;gap:7px;min-width:0\"><span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:{{ it.ac }};color:#fff;font-size:9.5px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ it.initials }}<\u002Fspan><span style=\"font-size:12px;color:#6B6862;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.who }}<\u002Fspan><\u002Fspan>\n                        <span style=\"flex:none;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;color:{{ it.dueColor }};background:{{ it.dueBg }};padding:3px 8px;border-radius:6px\">{{ it.due }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDecision }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto\">\n        <div style=\"max-width:960px;margin:0 auto;padding:32px 48px 90px\">\n          <button onclick=\"{{ goEngagements }}\" style=\"border:none;background:none;cursor:pointer;color:#8A857C;font-size:13px;font-weight:500;padding:0;margin-bottom:18px;display:flex;align-items:center;gap:6px\" style-hover=\"color:#4B46D6\">← Engagements<\u002Fbutton>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n            <span style=\"display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:{{ decision.statusColor }};background:{{ decision.statusBg }};padding:5px 11px;border-radius:20px\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ decision.statusColor }}\"><\u002Fspan>{{ decision.status }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:600;color:#8A857C;text-transform:uppercase;letter-spacing:.05em\">Objet décision<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2\">{{ decision.title }}<\u002Fh1>\n          <p style=\"margin:12px 0 0;font-size:14.5px;color:#6B6862;line-height:1.55\">{{ decision.context }}<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:26px;margin-top:28px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:26px\">\n              <div>\n                <h2 style=\"margin:0 0 12px;font-size:14px;font-weight:700\">Passage qui la justifie<\u002Fh2>\n                <div style=\"border:1px solid #E9E5DE;background:#fff;border-radius:14px;padding:16px 18px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px\"><span style=\"font-size:13px;font-weight:600;color:#1C1B1A\">{{ decision.passage.session }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4B46D6;background:#EEEDFB;padding:2px 8px;border-radius:5px;cursor:pointer\">▸ {{ decision.passage.time }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:14px;line-height:1.6;color:#33302B;border-left:2.5px solid #E4E2F6;padding-left:13px;font-style:italic\">« {{ decision.passage.text }} »<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div>\n                <h2 style=\"margin:0 0 12px;font-size:14px;font-weight:700\">Tâches liées<\u002Fh2>\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ decision.tasks }}\" as=\"t\" hint-placeholder-count=\"2\">\n                    <div style=\"border:1px solid #E9E5DE;background:#fff;border-radius:12px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n                      <div style=\"display:flex;align-items:center;gap:10px;min-width:0\"><span style=\"flex:none;width:26px;height:26px;border-radius:50%;background:{{ t.ac }};color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ t.initials }}<\u002Fspan><div style=\"min-width:0\"><div style=\"font-size:13.5px;font-weight:600;line-height:1.35\">{{ t.what }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A857C\">{{ t.who }} · {{ t.due }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                      <span style=\"flex:none;font-size:11px;font-weight:600;color:{{ t.sc }};background:{{ t.sbg }};padding:4px 10px;border-radius:20px\">{{ t.status }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <div style=\"border:1px solid #E9E5DE;background:#fff;border-radius:14px;padding:16px\">\n                <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9A968E;font-weight:700;margin-bottom:12px\">Responsable<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:11px\"><span style=\"width:38px;height:38px;border-radius:50%;background:{{ decision.owner.ac }};color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center\">CR<\u002Fspan><div><div style=\"font-size:14px;font-weight:600\">{{ decision.owner.name }}<\u002Fdiv><div style=\"font-size:12px;color:#8A857C\">{{ decision.owner.role }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border:1px solid #E9E5DE;background:#fff;border-radius:14px;padding:16px\">\n                <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9A968E;font-weight:700;margin-bottom:14px\">Historique<\u002Fdiv>\n                <div style=\"position:relative;padding-left:20px\">\n                  <div style=\"position:absolute;left:4px;top:5px;bottom:5px;width:2px;background:#EAE6DE\"><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:14px\">\n                    <sc-for list=\"{{ decision.history }}\" as=\"h\" hint-placeholder-count=\"3\">\n                      <div style=\"position:relative\"><span style=\"position:absolute;left:-20px;top:3px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #4B46D6\"><\u002Fspan><div style=\"font-size:13px;font-weight:600\">{{ h.t }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8A857C;font-family:'IBM Plex Mono',monospace;margin-top:1px\">{{ h.d }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:40px\">\n        <div style=\"width:100%;max-width:520px\">\n          <div style=\"background:#fff;border:1px solid #E9E5DE;border-radius:18px;box-shadow:0 12px 40px rgba(20,18,15,.1);overflow:hidden\">\n            <div style=\"background:linear-gradient(180deg,#F6F5FE,#fff);padding:22px 24px;border-bottom:1px solid #F1EDE6;display:flex;align-items:center;gap:12px\">\n              <span style=\"width:38px;height:38px;border-radius:11px;background:#EEEDFB;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 18 18\" fill=\"none\"><path d=\"M5 9.5 L7.5 12 L13 6\" stroke=\"#4B46D6\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div><div style=\"font-size:16px;font-weight:700;letter-spacing:-.01em\">Une tâche vous a été attribuée<\u002Fdiv><div style=\"font-size:12.5px;color:#8A857C;margin-top:2px\">Confirmez ou ajustez votre engagement<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:24px\">\n              <div style=\"font-size:12px;font-weight:600;color:#8A857C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px\">Tâche<\u002Fdiv>\n              <div style=\"font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.35;margin-bottom:20px\">{{ confirm.task }}<\u002Fdiv>\n\n              <div style=\"display:flex;gap:14px;margin-bottom:20px\">\n                <div style=\"flex:1;border:1px solid #EDE9E1;border-radius:11px;padding:12px 14px\"><div style=\"font-size:11px;color:#9A968E;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">Responsable<\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:26px;height:26px;border-radius:50%;background:{{ confirm.ownerAc }};color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center\">{{ confirm.ownerInit }}<\u002Fspan><span style=\"font-size:13.5px;font-weight:600\">{{ confirm.owner.name }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:1;border:1px solid #EDE9E1;border-radius:11px;padding:12px 14px\">< \n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow-y:auto\">\n        <div style=\"max-width:760px;margin:0 auto;padding:38px 48px 90px\">\n          <h1 style=\"margin:0;font-size:28px;font-weight:700;letter-spacing:-.025em\">Réglages<\u002Fh1>\n          <p style=\"margin:7px 0 0;font-size:14.5px;color:#6B6862;line-height:1.5\">Gérez votre profil, vos préférences et vos couloirs partagés.<\u002Fp>\n\n          <sc-if value=\"{{ isSchool }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:28px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:13px\"><h2 style=\"margin:0;font-size:15px;font-weight:700\">Gestion des couloirs<\u002Fh2><button style=\"border:none;background:#4B46D6;color:#fff;cursor:pointer;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\"><line x1=\"8\" y1=\"3\" x2=\"8\" y2=\"13\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline><line x1=\"3\" y1=\"8\" x2=\"13\" y2=\"8\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline><\u002Fsvg>Créer un couloir<\u002Fbutton><\u002Fdiv>\n              <div style=\"border:1px solid #E9E5DE;background:#fff;border-radius:14px;overflow:hidden\">\n                <sc-for list=\"{{ corridors }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid #F4F1EB\">\n                    <span style=\"width:36px;height:36px;border-radius:10px;background:{{ c.color }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none\">{{ c.ini }}<\u002Fspan>\n n    clearInterval(this.reveal);\n    this.setState({ screen:'report', sessionId: this.DETAIL[this.state.workspace].report ? 'rep' : null });\n  }\n  ask(q){ this.setState({ query: q, answered: true }); }\n  TYPES = { enterprise:['Réunion','Entretien','Revue','Atelier','Board'], school:['Cours magistral','TD','TP','Séminaire','Révision'] };\n  toggleOpt(k){ this.setState(st => ({ opts: { ...(st.opts||{transc:true,resume:true,extract:true}), [k]: !(st.opts||{transc:true,resume:true,extract:true})[k] } })); }\n\n  AV = ['#4B46D6','#2F6FB0','#E0662D','#2E9E6B','#9B4DCA','#C99A2E','#B0472F'];\n\n  DATA = {\n    enterprise: {\n      org: 'Meridian SaaS', userName: 'Camille Roy', userRole: 'Product Lead', userInitials: 'CR',\n      statLabel: 'Sessions capturées', statCount: '17',\n      sessionsSub: 'Vos réunions, transcrites et résumées automatiquement. Retrouvez chaque décision au fil du temps.',\n      filter1: 'Réunions', filter2: 'Entretiens', filter3: 'Revues',\n      sessions: [\n        { id:'e-live', status:'live', type:'Réunion', context:'Produit', title:'Comité produit — Roadmap Q3', timer:'00:23:41' },\n        { id:'e-rep', status:'done', type:'Réunion', context:'Refonte mobile', title:'Revue budget — Refonte application mobile', dateLabel:'28 juin', duration:'47 min',\n          badges:[{ai:true,text:'Résumé IA'},{text:'4 décisions'},{text:'6 tâches'}], avA:[0,2,3], more:'+2' },\n        { id:'e2', status:'done', type:'Hebdo', context:'Design System', title:'Point hebdo — Design System v3', dateLabel:'27 juin', duration:'32 min',\n          badges:[{ai:true,text:'Résumé IA'},{text:'2 décisions'},{text:'3 tâches'}], avA:[1,4], more:'+1' },\n        { id:'e3', status:'done', type:'Revue', context:'Sécurité', title:'Revue sécurité — Conformité PCI-DSS', dateLabel:'25 juin', duration:'58 min',\n          badges:[{ai:true,text:'Résumé IA'},{text:'3 décisions'},{text:'5 tâches'}], avA:[2,1,5], more:'+3' },\n        { id:'e4', status:'done', type:'Entretien', cont atus==='live' ? '#E5484D' : (s.status==='done' ? '#2E9E6B' : '#C99A2E');\n    return {\n      ...s,\n      isLive: s.status==='live',\n      notLive: s.status!=='live',\n      opacity: s.status==='upcoming' ? '.82' : '1',\n      badges: (s.badges||[]).map(b => this.buildBadge(b)),\n      avatars,\n      moreLabel: s.more || '',\n      open: () => {\n        if(s.status==='live') this.enterLive();\n        else if(s.status==='done') this.setState({ screen:'report', sessionId:s.id });\n      }\n    };\n  }\n\n  renderVals(){\n    const w = this.state.workspace;\n    const ws0 = this.DATA[w];\n    const s = this.state.screen;\n    const list = ws0.sessions.map(x => this.buildSession(x));\n    const live = list.filter(x=>x.status==='live');\n    const done = list.filter(x=>x.status==='done');\n    const up = list.filter(x=>x.status==='upcoming');\n    const groups = [];\n    if(live.length) groups.push({ key:'live', label:'En cours', count:live.length, dot:'#E5484D', items:live });\n    groups.push({ key:'done', label:'Terminées', count:done.length, dot:'#2E9E6B', items:done });\n    groups.push({ key:'upcoming', label:'À venir', count:up.length, dot:'#C99A2E', items:up });\n\n    const seg = (on) => on\n      ? { Bg:'#fff', Color:'#1C1B1A', Shadow:'0 1px 3px rgba(20,18,15,.12)' }\n      : { Bg:'transparent', Color:'#8A857C', Shadow:'none' };\n    const school = seg(w==='school');\n    const ent = seg(w==='enterprise');\n\n    const navItem = (active) => active\n      ? { bg:'#EEEDFB', color:'#4B46D6', fw:'600' }\n      : { bg:'transparent', color:'#5C5850', fw:'500' };\n\n    const D = this.DETAIL[w];\n    // LIVE\n    const L = D.live;\n    const liveTranscript = L.transcript.slice(0, this.state.liveIdx).map((x,idx) => ({ ...x, ac:this.AV[x.c], isNew: idx===this.state.liveIdx-1 }));\n    const liveKeypoints = L.keypoints.slice(0, this.state.kpIdx).map((x,idx) => ({ ...x, isNew: idx===this.state.kpIdx-1 }));\n    const waveBars = Array.from({length:60}, (_,i) => ({ h: (18 + Math.round(Math.abs(Math.sin(i*1.7)+Math.cos(i*0.6))*36)) + '%', delay: ((i%12)*0.07).toFixed(2)+'s' }));\n    const liveObj = { ...L, timer:this.fmt(this.state.elapsed), speakers:L.speakers.map(sp=>({...sp,ac:this.AV[sp.c]})), transcript:liveTranscript, keypoints:liveKeypoints, waveBars };\n    // REPORT\n    const R = D.report;\n    const reportObj = { ...R,\n      decisions:R.decisions.map((t,i)=>({t,n:String(i+1)})),\n      tasks:R.tasks.map(t=>({...t, ac:this.AV[t.c], initials:t.who.split(' ').map(p=>p[0]).slice(0,2).join('')})),\n      taskC1:R.taskCols[0], taskC2:R.taskCols[1], taskC3:R.taskCols[2],\n      transcript:R.transcript.map(x=>({...x, ac:this.AV[x.c]})),\n      docs:R.docs\n    };\n    // SEARCH\n    const S = D.search;\n    const searchObj = { ...S, suggestions:S.suggestions.map(q=>({ q, on:()=>this.ask(q) })), answered:this.state.answered, query:this.state.query || '', notAnswered:!this.state.answered };\n    // THREAD\n    const T = D.thread;\n    const threadObj = { ...T };\n\n    // ===== EXTRA screens =====\n    const E = this.EXTRA[w];\n    const isSchool = w==='school', isEnt = w==='enterprise';\n\n    // space perso/collectif\n    const spc = this.state.space || 'perso';\n    const spSeg = (on)=> on ? {bg:'#fff',color:'#1C1B1A',shadow:'0 1px 3px rgba(20,18,15,.12)'} : {bg:'transparent',color:'#8A857C',shadow:'none'};\n    const spP = spSeg(spc==='perso'), spC = spSeg(spc==='collectif');\n    const spaceSeg = { persoBg:spP.bg, persoColor:spP.color, persoShadow:spP.shadow, collBg:spC.bg, collColor:spC.color, collShadow:spC.shadow, onPerso:()=>this.setSpace('perso'), onColl:()=>this.setSpace('collectif') };\n\n    // dashboard\n    const openShort = (k)=> k==='quiz' ? this.setState({screen:'quiz',quizIdx:0,quizChosen:null}) : this.setState({screen:k});\n    const recent = done.slice(0,3).map(x=>({ title:x.title, context:x.context, date:x.dateLabel, duration:x.duration, open:()=>this.setState({screen:'report'}) }));\n    const dashObj = { ...E.dashboard,\n      scopeNote: spc==='collectif' ? E.dashboard.collNote : E.dashboard.persoNote,\n      recent, threads:E.dashboard.threads.map(t=>({...t, open:()=>this.setState({screen:'thread'})})),\n      shortcuts:E.dashboard.shortcuts.map(s2=>({ label:s2.label, on:()=>openShort(s2.k) })) };\n\n    // engagements (enterprise)\n    const duePill = (it)=> it.overdue?{bg:'#FCEBEC',color:'#D33A40'}: it.soon?{bg:'#FBF3E1',color:'#B4832B'}: it.done?{bg:'#E9F6EF',color:'#2E9E6B'}:{bg:'#F4F2EE',color:'#6B6862'};\n    const engObj = E.engagements ? { columns: E.engagements.columns.map(col=>({ ...col,\n      count: col.items.length,\n      items: col.items.map(it=>{ const dp=duePill(it); return {...it, ac:this.AV[it.c], initials:it.who.split(' ').map(p=>p[0]).slice(0,2).join(''), dueBg:dp.bg, dueColor:dp.color, open:()=> it.proposed ? this.setState({screen:'confirm'}) : this.setState({screen:'decision'}) }; }) })) } : { columns:[] };\n\n    // decision (enterprise)\n    const decObj = E.decision ? (()=>{ const dc=E.decision; return { ...dc, owner:{...dc.owner, ac:this.AV[dc.owner.c]}, tasks:dc.tasks.map(t=>({...t, ac:this.AV[t.c], initials:t.who.split(' ').map(p=>p[0]).slice(0,2).join('')})) }; })() : {};\n\n    // confirm (enterprise)\n    const confObj = E.confirm ? { ...E.confirm, ownerAc:this.AV[E.confirm.owner.c], ownerInit:E.confirm.owner.name.split(' ').map(p=>p[0]).slice(0,2).join(''), goEng:()=>this.setState({screen:'engagements'}) } : {};\n\n    // corridors (school)\n    const corridorsObj = E.corridors ? E.corridors.map((c,idx)=>({ ...c, ini:c.name.charAt(0), open:()=>this.openCorridor(idx) })) : [];\n    const cd = E.corridorDetail;\n    const corridorObj = cd ? { ...cd, ini:cd.name.charAt(0), subjects: cd.subjects.map(s2=>({...s2, pct:s2.mastery+'%'})), membersAv:(cd.membersAv||[]).map(i=>({ t:({0:'CR',1:'YB',2:'SD',3:'ML',4:'PL',5:'AK',6:'NF'})[i], c:this.AV[i] })) } : {};\n\n    // mastery (school)\n    const lvl = { ok:{color:'#2E9E6B',bg:'#E9F6EF',label:'Maîtrisé'}, weak:{color:'#E0662D',bg:'#FBEDE3',label:'Fragile'}, gap:{color:'#D33A40',bg:'#FCEBEC',label:'Non couvert'} };\n    const masteryObj = E.mastery ? { global:E.mastery.global, globalPct:E.mastery.global+'%', dash: (2*Math.PI*52), off: (2*Math.PI*52)*(1-E.mastery.global/100), subject:E.mastery.subject,\n      notions:E.mastery.notions.map(n=>({ name:n.name, pct:n.pct+'%', color:lvl[n.level].color, bg:lvl[n.level].bg, badge:lvl[n.level].label })) } : {};\n\n    // tutor (school)\n    const tutorObj = E.tutor ? { topic:E.tutor.topic, listening:this.state.tutorListening, micBg:this.state.tutorListening?'#E5484D':'#4B46D6', micLabel:this.state.tutorListening?'À l’écoute…':'Appuie pour répondre',\n      messages:E.tutor.messages.map(m=>({ ...m, me:m.role==='me', ai:m.role==='ai', align:m.role==='me'?'flex-end':'flex-start', bg:m.role==='me'?'#4B46D6':'#fff', color:m.role==='me'?'#fff':'#1C1B1A', border:m.role==='me'?'#4B46D6':'#E9E5DE' })),\n      toggle:()=>this.toggleTutor() } : {};\n\n    // adapted (school)\n    const at = this.state.adaptedTab || 'contenu';\n    const adaptedObj = E.adapted ? { title:E.adapted.title,\n      tabs:E.adapted.tabs.map(t=>({ ...t, on:()=>this.setAdaptedTab(t.key), bg:t.key===at?'#1C1B1A':'#fff', color:t.key===at?'#fff':'#6B6862', border:t.key===at?'#1C1B1A':'#E6E1D8' })),\n      isContenu:at==='contenu', isExercices:at==='exercices', isAnnonces:at==='annonces', isQcm:at==='qcm',\n      summary:E.adapted.summary, notions:E.adapted.notions.map((t,i)=>({t,n:String(i+1)})),\n      exercices:E.adapted.exercices, annonces:E.adapted.annonces, launchQuiz:()=>this.setState({screen:'quiz',quizIdx:0,quizChosen:null}) } : {};\n\n    // quiz (school)\n    let quizObj = {};\n    if(E.quiz){ const qi=this.state.quizIdx||0, q=E.quiz.questions[qi], chosen=this.state.quizChosen;\n      quizObj = { num:qi+1, total:E.quiz.questions.length, progress:Math.round((qi+1)/E.quiz.questions.length*100)+'%', question:q.q, answered:chosen!=null, explain:q.explain,\n        options:q.options.map((o,i)=>{ let bg='#fff',border='#E6E1D8',color='#1C1B1A',ic=''; if(chosen!=null){ if(i===q.correct){bg='#E9F6EF';border='#2E9E6B';color='#1C6E45';ic='✓';} else if(i===chosen){bg='#FCEBEC';border='#D33A40';color='#B02631';ic='✕';} } return { text:o, bg, border, color, ic, showIc: ic?'flex':'none', on:()=>this.chooseQuiz(i) }; }),\n        next:()=>this.nextQuiz() };\n    }\n\n    // nav (workspace-aware)\n    const navCls = (a)=> a ? { bg:'#EEEDFB', color:'#4B46D6', fw:'600' } : { bg:'transparent', color:'#5C5850', fw:'500' };\n    const mk = (a, on)=> ({ ...navCls(a), on });\n    const nav2 = {\n      dashboard: mk(s==='dashboard', ()=>this.go('dashboard')),\n      sessions: mk(['sessions','report','new','live'].includes(s), ()=>this.go('sessions')),\n      search: mk(s==='search', ()=>this.go('search')),\n      thread: mk(s==='thread', ()=>this.go('thread')),\n      corridors: mk(['corridors','corridorDetail'].includes(s), ()=>this.go('corridors')),\n      mastery: mk(s==='mastery', ()=>this.go('mastery')),\n      tutor: mk(s==='tutor', ()=>this.go('tutor')),\n      adapted: mk(s==='adapted', ()=>this.go('adapted')),\n      quiz: mk(s==='quiz', ()=>this.setState({screen:'quiz',quizIdx:0,quizChosen:null})),\n      engagements: mk(['engagements','confirm'].includes(s), ()=>this.go('engagements')),\n      decisions: mk(s==='decision', ()=>this.go('decision')),\n      mobile: mk(s==='mobile', ()=>this.go('mobile')),\n      settings: mk(s==='settings', ()=>this.go('settings'))\n    };\n\n    // NEW\n    const opts = this.state.opts || { transc:true, resume:true, extract:true };\n    const nt = this.state.newType || this.TYPES[w][0];\n    const newTypes = this.TYPES[w].map(t => ({ label:t, active:t===nt,\n      bg: t===nt ? '#4B46D6' : '#fff', color: t===nt ? '#fff' : '#6B6862',\n      border: t===nt ? '#4B46D6' : '#E6E1D8',\n      on: () => this.setState({ newType:t }) }));\n    const tog = (on) => ({ track: on ? '#4B46D6' : '#D9D4CA', x: on ? '20px' : '2px' });\n    const newTitle = w==='school' ? 'CM — Programmation dynamique' : 'Comité produit — Sprint review';\n    const newObj = {\n      types:newTypes, titlePlaceholder:newTitle,\n      transc:tog(opts.transc), resume:tog(opts.resume), extract:tog(opts.extract),\n      toggleTransc:()=>this.toggleOpt('transc'), toggleResume:()=>this.toggleOpt('resume'), toggleExtract:()=>this.toggleOpt('extract'),\n      extractLabel: w==='school' ? 'Extraction des notions & exercices' : 'Extraction des décisions & tâches',\n      dateVal: w==='school' ? '2026-07-03' : '2026-07-02'\n    };\n\n    return {\n      new: newObj,\n      isSchool, isEnt,\n      isDashboard: s==='dashboard', isEngagements: s==='engagements', isConfirm: s==='confirm', isDecision: s==='decision',\n      isCorridors: s==='corridors', isCorridorDetail: s==='corridorDetail', isMastery: s==='mastery', isTutor: s==='tutor',\n      isAdapted: s==='adapted', isQuiz: s==='quiz', isSettings: s==='settings', isLogin: s==='login',\n      spaceSeg,\n      dash: dashObj, eng: engObj, decision: decObj, confirm: confObj,\n      corridors: corridorsObj, corridor: corridorObj, mastery: masteryObj, tutor: tutorObj, adapted: adaptedObj, quiz: quizObj,\n      wsLabel: isSchool ? 'École' : 'Entreprise',\n      login: () => this.setState({ screen:'dashboard' }),\n      logout: () => this.setState({ screen:'login' }),\n      goDashboard: () => this.go('dashboard'),\n      goCorridors: () => this.go('corridors'),\n      goEngagements: () => this.go('engagements'),\n      ws: { ...ws0,\n        schoolBg:school.Bg, schoolColor:school.Color, schoolShadow:school.Shadow,\n        entBg:ent.Bg, entColor:ent.Color, entShadow:ent.Shadow },\n      org: ws0.org, userName: ws0.userName, userRole: ws0.userRole, userInitials: ws0.userInitials,\n      screen: s,\n      isSessions: s==='sessions',\n      isNew: s==='new',\n      isLive: s==='live',\n      isReport: s==='report',\n      isSearch: s==='search',\n      isThread: s==='thread',\n      isMobile: s==='mobile',\n      groups,\n      live: liveObj,\n      report: reportObj,\n      search: searchObj,\n      thread: threadObj,\n      enterLive: () => this.enterLive(),\n      stopLive: () => this.setState({ screen:'report' }),\n      startSession: () => this.enterLive(),\n      ask: (q) => this.ask(q),\n      askSuggestion0: () => this.ask(S.suggestions[0]),\n      resetSearch: () => this.setState({ answered:false, query:'' }),\n      openReport: () => this.setState({ screen:'report' }),\n      openThread: () => this.setState({ screen:'thread' }),\n      nav: nav2,\n      setSchool: () => this.setWs('school'),\n      setEnterprise: () => this.setWs('enterprise'),\n      goSessions: () => this.go('sessions'),\n      goNew: () => this.go('new'),\n      goSearch: () => this.go('search'),\n      goThreads: () => this.go('thread'),\n      goMobile: () => this.go('mobile')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
