spring.application.name=memoria-core
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/memoria
spring.datasource.username=memoria
spring.datasource.password=memoria

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

memoria.stockage.audio.repertoire-base=./data/audio
memoria.stockage.document.repertoire-base=./data/documents

# Une vraie photo de telephone (haute resolution) depasse largement la limite
# par defaut de Spring (1 Mo) : on l'augmente pour couvrir des photos de tableau.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:}
azure.speech.langue=fr-FR
azure.speech.max-locuteurs=4

azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.key=${AZURE_OPENAI_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}

azure.docintel.endpoint=${AZURE_DOCINTEL_ENDPOINT:}
azure.docintel.key=${AZURE_DOCINTEL_KEY:}

azure.openai.embedding.deployment=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:}

azure.search.endpoint=${AZURE_SEARCH_ENDPOINT:}
azure.search.key=${AZURE_SEARCH_KEY:}
azure.search.index=memoria-segments

# Secret utilise pour signer les JWT. En dev, une valeur par defaut permet de
# demarrer sans configuration ; en production, MEMORIA_JWT_SECRET doit etre
# une valeur aleatoire d'au moins 32 caracteres gardee hors du code.
memoria.jwt.secret=${MEMORIA_JWT_SECRET:dev-secret-a-remplacer-en-production-32chars-minimum}
memoria.jwt.expiration-heures=24

# SMTP pour les rappels d'engagements. memoria.email.host vide = envoi
# desactive (log uniquement) -- comme les clients Azure, jamais de crash au
# demarrage faute de credentials.
memoria.email.host=${MEMORIA_EMAIL_HOST:}
memoria.email.port=${MEMORIA_EMAIL_PORT:587}
memoria.email.username=${MEMORIA_EMAIL_USERNAME:}
memoria.email.password=${MEMORIA_EMAIL_PASSWORD:}
memoria.email.expediteur=${MEMORIA_EMAIL_EXPEDITEUR:no-reply@memoria.local}

# Verification des echeances d'engagements. Toutes les heures par defaut,
# surchargeable pour les tests en conditions reelles.
memoria.rappel.cron=${MEMORIA_RAPPEL_CRON:0 0 * * * *}

# Reconnaissance de locuteur recurrente. Service auto-heberge (speaker-service/,
# Python + SpeechBrain ECAPA-TDNN) -- gratuit, remplace Azure Speaker
# Recognition (retire par Microsoft le 30/09/2025, voir IdentificateurLocuteurAzureSpeech).
memoria.speaker-service.url=${MEMORIA_SPEAKER_SERVICE_URL:http://127.0.0.1:8090}
azure.speaker.seuil-confiance=${AZURE_SPEAKER_SEUIL_CONFIANCE:0.70}
memoria.locuteur.duree-minimale-identification-ms=${MEMORIA_LOCUTEUR_DUREE_MINIMALE_MS:1500}
