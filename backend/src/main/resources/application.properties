spring.application.name=memoria-core
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/memoria}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:memoria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:memoria}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

memoria.stockage.audio.repertoire-base=./data/audio
memoria.stockage.document.repertoire-base=./data/documents

# Une vraie photo de telephone (haute resolution) depasse largement la limite
# par defaut de Spring (1 Mo) : on l'augmente pour couvrir des photos de tableau.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:}
azure.speech.langue=fr-FR
azure.speech.max-locuteurs=4
# Voix de synthese (TTS) du tuteur vocal -- meme ressource/cle Azure Speech
# que la transcription, endpoint different.
azure.speech.tts.voix=fr-FR-DeniseNeural

azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.key=${AZURE_OPENAI_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}

azure.docintel.endpoint=${AZURE_DOCINTEL_ENDPOINT:}
azure.docintel.key=${AZURE_DOCINTEL_KEY:}

azure.openai.embedding.deployment=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:}

azure.search.endpoint=${AZURE_SEARCH_ENDPOINT:}
azure.search.key=${AZURE_SEARCH_KEY:}
azure.search.index=memoria-segments

# Secret utilise pour signer les JWT. En dev, une valeur par defaut permet de
# demarrer sans configuration ; en production, MEMORIA_JWT_SECRET doit etre
# une valeur aleatoire d'au moins 32 caracteres gardee hors du code.
memoria.jwt.secret=${MEMORIA_JWT_SECRET:dev-secret-a-remplacer-en-production-32chars-minimum}
memoria.jwt.expiration-heures=24

# Restriction d'inscription par domaine email -- brique "phase-15-restriction-domaine-email".
# "Instance = tenant" (meme raisonnement que le budget Azure en phase-11 et la
# retention RGPD en phase-13) : une seule liste globale de domaines pour
# l'instance, pas un concept de tenant a construire. Vide par defaut = aucune
# restriction (comportement historique). Domaines separes par des virgules
# (ex. episen.fr,etu.episen.fr) -- un etablissement a souvent plusieurs
# domaines email (profs vs etudiants).
memoria.inscription.domaines-autorises=${MEMORIA_INSCRIPTION_DOMAINES_AUTORISES:}

# Role admin -- brique "phase-20-role-admin". Emails complets separes par des
# virgules (pas des domaines, contrairement a la restriction ci-dessus) :
# accorde le statut admin a l'inscription (AuthService) et, pour un compte
# deja existant, au demarrage suivant (AdminBootstrapRunner). Vide par
# defaut = aucun admin, jamais de promotion en libre-service.
memoria.admin.emails-autorises=${MEMORIA_ADMIN_EMAILS_AUTORISES:}

# SMTP pour les rappels d'engagements. memoria.email.host vide = envoi
# desactive (log uniquement) -- comme les clients Azure, jamais de crash au
# demarrage faute de credentials.
memoria.email.host=${MEMORIA_EMAIL_HOST:}
memoria.email.port=${MEMORIA_EMAIL_PORT:587}
memoria.email.username=${MEMORIA_EMAIL_USERNAME:}
memoria.email.password=${MEMORIA_EMAIL_PASSWORD:}
memoria.email.expediteur=${MEMORIA_EMAIL_EXPEDITEUR:no-reply@memoria.local}

# Verification des echeances d'engagements. Toutes les heures par defaut,
# surchargeable pour les tests en conditions reelles.
memoria.rappel.cron=${MEMORIA_RAPPEL_CRON:0 0 * * * *}

# Reconnaissance de locuteur recurrente. Service auto-heberge (speaker-service/,
# Python + SpeechBrain ECAPA-TDNN) -- gratuit, remplace Azure Speaker
# Recognition (retire par Microsoft le 30/09/2025, voir IdentificateurLocuteurAzureSpeech).
memoria.speaker-service.url=${MEMORIA_SPEAKER_SERVICE_URL:http://127.0.0.1:8090}
azure.speaker.seuil-confiance=${AZURE_SPEAKER_SEUIL_CONFIANCE:0.70}
memoria.locuteur.duree-minimale-identification-ms=${MEMORIA_LOCUTEUR_DUREE_MINIMALE_MS:1500}

# Observabilite (Prometheus + Grafana + OpenTelemetry) -- brique "phase-7-observabilite".
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Necessaire pour calculer des percentiles (p95/p99) via histogram_quantile()
# cote Prometheus/Grafana -- sans ca, seuls count/sum/max sont exportes.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Tag applique a toutes les metriques exportees : utile des qu'un deuxieme
# service sera un jour scrape par le meme Prometheus.
management.metrics.tags.application=${spring.application.name}

# Maitrise des couts Azure -- brique "phase-11-maitrise-couts-azure". Tarifs
# par defaut approximatifs (documentes comme tels dans docs/couts-azure.md) :
# les vrais tarifs Azure varient par region/contrat, jamais code en dur comme
# une facturation precise. "Quotas par tenant" = budget global de l'instance
# (une instance dediee par client, pas de multi-tenant interne -- voir
# docs/deploiement.md) : l'instance EST le tenant.
memoria.cout.azure.budget-mensuel-euros=${MEMORIA_COUT_BUDGET_MENSUEL_EUROS:100}
# false par defaut : un depassement de budget est toujours logue (WARN),
# jamais bloquant sauf activation explicite -- doctrine "outil d'aide, pas
# de surveillance" deja appliquee ailleurs dans ce projet.
memoria.cout.azure.mode-strict=${MEMORIA_COUT_MODE_STRICT:false}
memoria.cout.azure.openai.euros-par-1k-tokens=0.002
memoria.cout.azure.speech.euros-par-heure=1.0
memoria.cout.azure.speech.euros-par-1k-caracteres=0.015
# Repli pour les services factures autrement qu'au token/a la duree (Azure AI
# Search, Document Intelligence en cas de reponse inattendue) -- une
# approximation de suivi relatif, pas une facturation reelle.
memoria.cout.azure.forfait-par-appel-euros=0.01

# Cache des embeddings ("ne jamais recalculer un embedding deja connu") --
# borne en memoire, pas de TTL (voir GenerateurEmbeddingAzureOpenAI).
memoria.cache.embeddings.taille-max=500

# Duree fixe des segments audio envoyes par le moteur de capture (voir
# frontend/src/components/Recorder.tsx, DUREE_SEGMENT_MS) -- utilisee pour
# estimer le cout Azure Speech STT par chunk, pas une mesure exacte decodee.
memoria.audio.duree-segment-secondes=30

# Resilience de la capture -- brique "phase-12-resilience-capture". Balayage
# planifie qui retraite les chunks dont l'evenement de transcription a ete
# perdu (ex: redemarrage serveur entre la sauvegarde du chunk et l'execution
# du listener @Async) -- voir TranscriptionService.rattraperTranscriptionsManquantes.
memoria.transcription.rattrapage.cron=${MEMORIA_TRANSCRIPTION_RATTRAPAGE_CRON:0 */5 * * * *}
# Marge par rapport au timeout Azure Speech (90s, voir TranscripteurAzureSpeech)
# pour ne pas retraiter un chunk encore en cours de traitement normal.
memoria.transcription.rattrapage.delai-grace-secondes=120

# Gouvernance des donnees (RGPD) -- brique "phase-13-gouvernance-donnees".
# "Duree de conservation parametrable par tenant" = duree globale de
# l'instance (une instance dediee par client, pas de multi-tenant interne --
# meme raisonnement que le budget Azure en phase-11). -1 par defaut : purge
# desactivee tant que le client n'a pas configure explicitement sa duree de
# conservation (doctrine "sur par defaut" deja appliquee au budget Azure).
memoria.rgpd.retention-jours=${MEMORIA_RGPD_RETENTION_JOURS:-1}
memoria.rgpd.retention.cron=${MEMORIA_RGPD_RETENTION_CRON:0 0 3 * * *}
