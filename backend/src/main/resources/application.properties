spring.application.name=memoria-core
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/memoria
spring.datasource.username=memoria
spring.datasource.password=memoria

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

memoria.stockage.audio.repertoire-base=./data/audio

azure.speech.key=${AZURE_SPEECH_KEY}
azure.speech.region=${AZURE_SPEECH_REGION}
azure.speech.langue=fr-FR
