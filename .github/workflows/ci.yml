name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests backend
        working-directory: backend
        run: mvn -B test

  frontend:
    name: Frontend (TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (verifie le typage et la compilation Vite)
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build (garde-fou)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ne push rien, ne deploie rien -- verifie seulement que les Dockerfiles
      # construisent reellement, pour eviter qu'ils se degradent en silence.
      - name: Build image backend
        run: docker build -t memoria-backend:ci ./backend

      - name: Build image frontend
        run: docker build -t memoria-frontend:ci ./frontend
