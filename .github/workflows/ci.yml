name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    # Filet de securite : un premier telechargement OWASP Dependency-Check sans
    # cle NVD_API_KEY peut etre tres lent (rate-limiting NIST, confirme
    # manuellement : bloque a 46% apres plus d'une heure sans cle) -- mieux vaut
    # un echec visible que des heures de minutes CI consommees en silence.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Date du jour (cle de cache OWASP)
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache base de vulnerabilites OWASP (NVD)
        uses: actions/cache@v4
        with:
          path: .owasp-dc-data
          key: owasp-dc-data-${{ steps.date.outputs.date }}
          restore-keys: owasp-dc-data-

      - name: Tests + gates qualite (couverture, analyse statique, scan dependances)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B verify

  frontend:
    name: Frontend (TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Audit des dependances (vulnerabilites connues)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (verifie le typage et la compilation Vite)
        working-directory: frontend
        run: npm run build

  speaker-service:
    name: speaker-service (scan dependances Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan des dependances (vulnerabilites connues)
        working-directory: speaker-service
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --no-deps

  docker:
    name: Docker build (garde-fou)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ne push rien, ne deploie rien -- verifie seulement que les Dockerfiles
      # construisent reellement, pour eviter qu'ils se degradent en silence.
      - name: Build image backend
        run: docker build -t memoria-backend:ci ./backend

      - name: Build image frontend
        run: docker build -t memoria-frontend:ci ./frontend
