name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    # Filet de securite generique (pas specifique a un outil) : mieux vaut un
    # echec visible qu'un job bloque en silence.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests + gates qualite (couverture, analyse statique)
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Audit des dependances (vulnerabilites connues)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (verifie le typage et la compilation Vite)
        working-directory: frontend
        run: npm run build

  speaker-service:
    name: speaker-service (scan dependances Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan des dependances (vulnerabilites connues)
        working-directory: speaker-service
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --no-deps

  dependency-review:
    name: Revue des dependances (toutes technos, PR uniquement)
    runs-on: ubuntu-latest
    # Ne s'execute que sur les PR : cette action diffe le graphe de dependances
    # base vs head, elle a besoin d'une base de comparaison. Couvre Maven/npm/
    # pip en une fois via le graphe de dependances natif de GitHub -- aucun
    # compte externe, contrairement a OWASP Dependency-Check (NVD) et Sonatype
    # OSS Index, tous deux abandonnes pour le scan Java (voir backend/pom.xml).
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker:
    name: Docker build (garde-fou)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ne push rien, ne deploie rien -- verifie seulement que les Dockerfiles
      # construisent reellement, pour eviter qu'ils se degradent en silence.
      - name: Build image backend
        run: docker build -t memoria-backend:ci ./backend

      - name: Build image frontend
        run: docker build -t memoria-frontend:ci ./frontend
