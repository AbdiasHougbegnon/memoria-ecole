#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - git

runcmd:
  # Installe Docker Engine + le plugin Compose (depot officiel Docker, pas le
  # paquet distro souvent obsolete).
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  # Le depot applicatif (docker-compose.yml, Dockerfiles) et le fichier .env
  # reel sont deployes separement (scp/CI), pas par ce cloud-init -- ce
  # script prepare seulement la machine, il ne demarre pas la stack.
