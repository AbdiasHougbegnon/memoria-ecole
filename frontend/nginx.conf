server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 = DNS embarque de Docker. Sans "resolver" + variable dans
    # proxy_pass, nginx resout "backend" UNE SEULE FOIS au chargement de la
    # config et met l'IP en cache indefiniment -- si le conteneur backend
    # redemarre (deploiement, mise a jour), il change d'IP interne et nginx
    # continue de taper sur l'ancienne (502 "Host is unreachable") jusqu'a
    # son propre redemarrage. La variable force une resolution a chaque
    # requete (rafraichie toutes les 10s via "valid").
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # $request_uri (l'URI d'origine, non normalisee) est repasse tel
        # quel a la suite du nom de service -- avec une variable dans
        # proxy_pass, nginx ne fait PAS le remplacement de prefixe habituel
        # (celui d'un proxy_pass statique avec un chemin final) ; utiliser
        # $request_uri evite toute ambiguite de concatenation de chemin.
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
